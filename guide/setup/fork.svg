<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-label="GitHub: Create a new fork">
<rect x="0.5" y="0.5" width="719" height="329" rx="10" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="40" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" fill="#1f2328" text-anchor="start">Create a new fork</text>
<text x="24" y="62" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#59636e" text-anchor="start">A fork is a copy of a repository.</text>
<line x1="24" y1="76" x2="696" y2="76" stroke="#d0d7de" stroke-width="1"/>
<text x="24" y="102" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Owner *</text>
<rect x="24" y="110" width="170" height="32" rx="6" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
<text x="36" y="131" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">your-name ▾</text>
<text x="204" y="132" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" fill="#59636e" text-anchor="start">/</text>
<text x="222" y="102" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Repository name *</text>
<rect x="222" y="110" width="240" height="32" rx="6" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
<text x="234" y="131" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#1f2328" text-anchor="start">wi-climate-map</text>
<rect x="216" y="104" width="252" height="44" rx="8" fill="none" stroke="#d9480f" stroke-width="3"/>
<text x="478" y="130.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#d9480f" text-anchor="start">any name, e.g. wi-climate-map</text>
<text x="24" y="172" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Description (optional)</text>
<rect x="24" y="180" width="438" height="32" rx="6" fill="#fff" stroke="#d0d7de" stroke-width="1"/>
<rect x="28" y="234" width="16" height="16" rx="3" fill="#0969da" stroke="#0969da" stroke-width="1"/>
<path d="M31.5 242.5 l3 3 l6 -7" fill="none" stroke="#fff" stroke-width="2"/>
<text x="52" y="247" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">Copy the main branch only</text>
<text x="52" y="265" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Contribute back to … by adding your own branch.</text>
<rect x="20" y="226" width="340" height="48" rx="8" fill="none" stroke="#d9480f" stroke-width="3"/>
<text x="370" y="254.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="600" fill="#d9480f" text-anchor="start">leave this ticked</text>
<rect x="24" y="284" width="106.08000000000001" height="30" rx="6" fill="#1f883d" stroke="#1f883d" stroke-width="1"/>
<text x="77.04" y="303.68" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#fff" text-anchor="middle">Create fork</text>
<rect x="18" y="278" width="118.08000000000001" height="42" rx="8" fill="none" stroke="#d9480f" stroke-width="3"/>
<circle cx="216" cy="104" r="11" fill="#d9480f"/><text x="216" y="108.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text><circle cx="20" cy="226" r="11" fill="#d9480f"/><text x="20" y="230.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text><circle cx="18" cy="278" r="11" fill="#d9480f"/><text x="18" y="282.5" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<text x="708" y="321" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="10.5" fill="#8c959f" text-anchor="end">Simplified drawing, not a screenshot</text>
</svg>
