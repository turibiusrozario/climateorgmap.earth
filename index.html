<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Climate Org Map</title>
  <meta name="description" content="Directory of climateorgmap.earth subdomains.">
  <style>
    :root {
      --bg: #f6f8f5;
      --fg: #1b2a22;
      --muted: #5d6f65;
      --card: #ffffff;
      --border: #d5ded8;
      --accent: #1f7a4d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111a15;
        --fg: #e6efe9;
        --muted: #93a79a;
        --card: #18241d;
        --border: #2b3d32;
        --accent: #5fcf94;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 0 16px;
      background: var(--bg);
      color: var(--fg);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 40rem; margin: 0 auto; padding: 3rem 0; }
    h1 { margin: 0 0 .25rem; font-size: 1.75rem; }
    .sub { margin: 0 0 2rem; color: var(--muted); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
    a.card {
      display: block;
      padding: 1rem 1.25rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: inherit;
      text-decoration: none;
    }
    a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
    .host { font-weight: 600; color: var(--accent); overflow-wrap: anywhere; }
    .desc { color: var(--muted); }
    #status { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Climate Org Map</h1>
    <p class="sub">Sites under climateorgmap.earth</p>
    <ul id="list"></ul>
    <p id="status">Loading…</p>
  </main>
  <script>
    const list = document.getElementById("list");
    const status = document.getElementById("status");
    fetch("subdomains.json", { cache: "no-cache" })
      .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(items => {
        if (!items.length) { status.textContent = "No subdomains yet."; return; }
        status.remove();
        for (const s of items) {
          const li = document.createElement("li");
          const a = document.createElement("a");
          a.className = "card";
          a.href = s.url;
          const host = document.createElement("div");
          host.className = "host";
          host.textContent = new URL(s.url).host;
          const desc = document.createElement("div");
          desc.className = "desc";
          desc.textContent = s.description || "";
          a.append(host, desc);
          li.append(a);
          list.append(li);
        }
      })
      .catch(() => { status.textContent = "Could not load the subdomain list."; });
  </script>
</body>
</html>
